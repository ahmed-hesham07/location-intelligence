[project]
name = "locintel"
version = "0.1.0"
description = "Daily batch pipeline: ERA5 + CAMS -> climate, solar and dust indicators for Egypt and the Gulf."
readme = "README.md"
license = "MIT"
requires-python = ">=3.12,<3.13"
dependencies = [
    "boto3>=1.43.126",
    "psycopg[binary]>=3.3.8",
    "pydantic-settings>=2.16.2",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/locintel"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "N"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
